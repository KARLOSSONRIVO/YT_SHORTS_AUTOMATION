[project]
name = "yt-shorts-python-worker"
version = "0.1.0"
description = "Internal Python worker for transcription, clip analysis, and subtitle generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "huggingface-hub>=0.30.0",
  "pillow>=10.0.0",
  "kokoro>=0.9.4",
  "misaki[ja,ko,zh]>=0.9.4",
  "ordered-set>=4.1.0",
  "pypinyin>=0.53.0",
  "cn2an>=0.5.22",
  "pyopenjtalk>=0.4.1",
  "fugashi>=1.3.2",
  "cutlet>=0.5.0",
  "jaconv>=0.4.0",
  "mojimoji>=0.0.13",
  "jieba>=0.42.1",
  "unidic-lite>=1.0.8",
  "unidic>=1.1.0",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
media = [
  "faster-whisper>=1.0.0",
  "librosa>=0.10.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
