services:
  python-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-automation-python-worker
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./media:/media
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ../models:/models:ro
    environment:
      PY_WORKER_APP_ENV: development
      PY_WORKER_LOG_LEVEL: INFO
      PY_WORKER_ENABLE_DOCS: "true"
      PY_WORKER_UPLOAD_DIR: /app/uploads
      PY_WORKER_OUTPUT_DIR: /app/outputs
      PY_WORKER_TTS_MODEL_PATH: /models/kokoro
    restart: unless-stopped
