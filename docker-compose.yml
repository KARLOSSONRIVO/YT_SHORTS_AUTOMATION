services:
  python-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-automation-python-worker
    env_file:
      - .env
      - ../BACKEND/.env
    ports:
      - "8000:8000"
    volumes:
      - ./media:/media
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      PY_WORKER_APP_ENV: development
      PY_WORKER_LOG_LEVEL: INFO
      PY_WORKER_ENABLE_DOCS: "true"
      PY_WORKER_UPLOAD_DIR: /app/uploads
      PY_WORKER_OUTPUT_DIR: /app/outputs
      PY_WORKER_AI_TIMEOUT_SECONDS: ${PY_WORKER_AI_TIMEOUT_SECONDS:-120}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_IMAGE_MODEL: ${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-2-klein-4b}
      PY_WORKER_GEMINI_TTS_MODEL: ${PY_WORKER_GEMINI_TTS_MODEL:-gemini-3.1-flash-tts-preview}
      PY_WORKER_GEMINI_VIDEO_MODEL: ${PY_WORKER_GEMINI_VIDEO_MODEL:-gemini-omni-flash-preview}
    restart: unless-stopped
